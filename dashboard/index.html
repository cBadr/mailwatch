<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>مراقب البريد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
:root{
  --bg:#f3f5fa; --card:#ffffff; --text:#171b26; --muted:#6a7282; --line:#e4e8f0;
  --accent:#0e7c86; --accent-ink:#ffffff; --accent-soft:#e3f4f5; --accent-soft-ink:#0b5d65;
  --danger:#c62f2f; --danger-soft:#fdeaea; --ok:#1f9d5c; --ok-soft:#e5f6ec; --warn:#c77700; --warn-soft:#fff3df;
  --chip:#eef1f6; --hover:#f6f8fc; --unread:#0e7c86;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px -16px rgba(16,24,40,.18);
  --radius:16px; --nav-h:64px;
}
:root[data-theme="dark"]{
  --bg:#0e1117; --card:#161a23; --text:#e8eaf0; --muted:#98a1b3; --line:#262c3a;
  --accent:#36c3cf; --accent-ink:#06282c; --accent-soft:#113a3f; --accent-soft-ink:#9fe3e9;
  --danger:#ff6b6b; --danger-soft:#3a1d1d; --ok:#4cd68a; --ok-soft:#163626; --warn:#ffb454; --warn-soft:#3a2a10;
  --chip:#222837; --hover:#1c2130; --unread:#36c3cf;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100dvh}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);height:60px;display:flex;align-items:center;gap:12px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#5fb8c7);display:grid;place-items:center;color:#fff;font-size:18px}
.topbar .grow{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;font-size:18px}
.iconbtn:hover{background:var(--hover)}
.layout{display:grid;grid-template-columns:1fr;max-width:1180px;margin:0 auto}
.side{display:none}
main{padding:16px 16px calc(var(--nav-h) + 24px);min-width:0}
.bottomnav{position:fixed;bottom:0;inset-inline:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:600}
.bottomnav a .ic{font-size:21px;line-height:1}
.bottomnav a.active{color:var(--accent)}
@media (min-width:960px){
  .layout{grid-template-columns:240px 1fr;gap:24px;padding:0 20px}
  .side{display:block;position:sticky;top:76px;align-self:start;padding:8px 0}
  .side a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--text);font-weight:600;margin-bottom:4px}
  .side a .ic{font-size:19px;width:24px;text-align:center}
  .side a:hover{background:var(--hover)}
  .side a.active{background:var(--accent-soft);color:var(--accent-soft-ink)}
  .bottomnav{display:none}
  main{padding:20px 0 40px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:14px}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.page-title h1{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;gap:12px}
.grid.stats{grid-template-columns:repeat(2,1fr)}
@media (min-width:700px){.grid.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 16px}
.stat .v{font-size:26px;font-weight:800;line-height:1.2}
.stat .l{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent-soft);color:var(--accent-soft-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.err{background:var(--danger-soft);color:var(--danger)}
.chip.tag{background:var(--accent-soft);color:var(--accent-soft-ink)}
.chip.btn{cursor:pointer;border:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:700;font-size:13.5px}
.field .hint{color:var(--muted);font-size:12.5px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
textarea.input{min-height:120px;resize:vertical}
.form-grid{display:grid;gap:0 14px;grid-template-columns:1fr}
@media (min-width:700px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .full{grid-column:1/-1}}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.item:last-child{border-bottom:0}
.item:hover{background:var(--hover)}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px}
.item .body{flex:1;min-width:0}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .from{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .time{color:var(--muted);font-size:12px;flex:none}
.item .subject{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .snippet{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.unread .from,.item.unread .subject{font-weight:800}
.item.unread .dot{width:9px;height:9px;border-radius:50%;background:var(--unread);flex:none;margin-top:16px}
.item .dot{width:9px;height:9px;flex:none;margin-top:16px}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{min-height:40px;padding:7px 12px}
.toolbar select.input{width:auto}
.toolbar .search{flex:1;min-width:160px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty .big{font-size:40px}
.msg-head h2{font-size:19px;font-weight:800;margin-bottom:8px;word-break:break-word}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin-top:10px}
.kv .k{color:var(--muted);font-weight:700}
.kv .v{word-break:break-word}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:none;padding:8px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--accent);border-color:var(--accent)}
.mailframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff;resize:vertical}
.pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;margin:0;padding:4px 2px}
.att{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px}
.att .ic{font-size:22px}
.att .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.att .s{color:var(--muted);font-size:12.5px}
.acc-card{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.acc-card:last-child{border-bottom:0}
.acc-card .info{flex:1;min-width:0}
.acc-card .name{font-weight:800}
.acc-card .mail{color:var(--muted);font-size:13px;direction:ltr;text-align:right;unicode-bidi:plaintext}
.bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.filter-row{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg)}
.filter-row .form-grid{grid-template-columns:1fr 1fr}
.toast{position:fixed;bottom:calc(var(--nav-h) + 16px);inset-inline:16px;margin:0 auto;max-width:480px;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);z-index:50;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--danger);color:#fff}
@media (min-width:960px){.toast{bottom:24px}}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:30px;justify-content:center}
.notice{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--accent-soft);color:var(--accent-soft-ink)}
.notice.err{background:var(--danger-soft);color:var(--danger)}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:left}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.log-row{padding:10px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.log-row:last-child{border-bottom:0}
.muted{color:var(--muted)}
.hidden{display:none !important}
details summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">✉</span><span>مراقب البريد</span></div>
  <div class="grow"></div>
  <button class="iconbtn" id="btnRefresh" title="تحديث البيانات">⟳</button>
  <button class="iconbtn" id="btnTheme" title="الوضع الليلي">◐</button>
</header>
<div class="layout">
  <nav class="side" id="sideNav"></nav>
  <main id="view"><div class="loading"><span class="spinner"></span> جارٍ التحميل…</div></main>
</div>
<nav class="bottomnav" id="bottomNav"></nav>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ========= أدوات عامة ========= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULTS = { mode: 'github', repo: 'cBadr/Hamza', codeRepo: 'cBadr/mailwatch', branch: 'main', token: '', prefix: 'data', localBase: '..', theme: 'auto' };
let settings = loadSettings();
const cache = new Map();          // url -> {etag, text}
const mem = { accounts: null, index: new Map(), config: null };
const NAV = [
  ['', '🏠', 'الرئيسية'], ['mail', '📥', 'الرسائل'], ['compose', '✍️', 'إنشاء'],
  ['accounts', '👥', 'الحسابات'], ['log', '🧾', 'السجل'], ['settings', '⚙️', 'الإعدادات'],
];
const PROVIDERS = { gmail: 'Gmail', yahoo: 'Yahoo', outlook: 'Outlook', icloud: 'iCloud', zoho: 'Zoho', custom: 'مخصص (IMAP)' };
const COLORS = ['#0e7c86','#6d5ce7','#d9480f','#1f9d5c','#c2255c','#2b6cb0','#b7791f','#5a67d8'];

function loadSettings() { try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem('mailwatch.settings') || '{}') }; } catch { return { ...DEFAULTS }; } }
function saveSettings() { try { localStorage.setItem('mailwatch.settings', JSON.stringify(settings)); } catch {} }
function applyTheme() {
  let t = settings.theme;
  if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
}
let toastTimer;
function toast(msg, isErr = false) {
  const el = $('#toast'); el.textContent = msg; el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = 'toast', isErr ? 6000 : 3200);
}
const fmtDT = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { dateStyle: 'medium', timeStyle: 'short' });
const fmtD = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'short' });
const fmtT = new Intl.DateTimeFormat('ar-EG-u-nu-latn', { hour: '2-digit', minute: '2-digit' });
function fdate(iso) { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? iso : fmtDT.format(d); }
function fshort(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; const now = new Date(); return d.toDateString() === now.toDateString() ? fmtT.format(d) : fmtD.format(d); }
function ago(iso) {
  if (!iso) return 'لم يُفحص بعد'; const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'الآن'; if (s < 3600) return `منذ ${Math.floor(s / 60)} دقيقة`; if (s < 86400) return `منذ ${Math.floor(s / 3600)} ساعة`; return `منذ ${Math.floor(s / 86400)} يوم`;
}
function fsize(b) { if (!b && b !== 0) return ''; if (b < 1024) return b + ' بايت'; if (b < 1048576) return (b / 1024).toFixed(0) + ' ك.ب'; return (b / 1048576).toFixed(1) + ' م.ب'; }
function addr(a) { if (!a) return ''; return a.name ? `${a.name}` : (a.email || ''); }
function addrFull(a) { if (!a) return ''; return a.name && a.email ? `${a.name} <${a.email}>` : (a.email || a.name || ''); }
function colorFor(s) { let h = 0; for (const c of String(s || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
function initial(a) { const s = (a?.name || a?.email || '?').trim(); return s[0]?.toUpperCase() || '?'; }
const DIAC = /[ؐ-ًؚ-ٰٟۖ-ۭـ]/g;
function norm(s) { return String(s || '').replace(DIAC, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').toLowerCase(); }
function monthLabel(m) { const [y, mo] = m.split('-'); const names = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر']; return `${names[+mo - 1] || mo} ${y}`; }
function currentMonth() { const d = new Date(); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`; }

/* ========= مصدر البيانات (GitHub API أو ملفات محلية) ========= */
const isLocal = () => settings.mode === 'local';
function ghHeaders(raw) {
  const h = { 'Accept': raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (settings.token) h.Authorization = 'Bearer ' + settings.token;
  return h;
}
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
function dataPath(path) { return settings.prefix ? `${settings.prefix.replace(/\/+$/, '')}/${path}` : path; }
function fileUrl(path) {
  if (isLocal()) return `${settings.localBase.replace(/\/+$/, '')}/${encPath(path)}`;
  return `https://api.github.com/repos/${settings.repo}/contents/${encPath(path)}?ref=${encodeURIComponent(settings.branch)}`;
}
async function errMsg(r) {
  let m = `خطأ ${r.status}`;
  try { const j = await r.json(); if (j.message) m += `: ${j.message}`; } catch {}
  if (r.status === 401) m = 'التوكن غير صالح أو منتهي الصلاحية';
  if (r.status === 403) m += ' — الصلاحيات غير كافية أو تجاوزت حد الطلبات';
  if (r.status === 404) m = 'غير موجود (تحقق من اسم المستودع والفرع والمسار)';
  return m;
}
async function fetchText(path, optional = true) {
  const url = fileUrl(path);
  const headers = isLocal() ? {} : ghHeaders(true);
  const c = cache.get(url);
  if (c && !isLocal()) headers['If-None-Match'] = c.etag;
  const r = await fetch(url, { headers, cache: 'no-store' });
  if (r.status === 304 && c) return c.text;
  if (r.status === 404) { if (optional) return null; throw new Error(await errMsg(r)); }
  if (!r.ok) throw new Error(await errMsg(r));
  const text = await r.text();
  const etag = r.headers.get('ETag');
  if (etag && !isLocal()) cache.set(url, { etag, text });
  return text;
}
async function fetchJSON(path, optional = true) { const t = await fetchText(path, optional); return t == null ? null : JSON.parse(t); }
async function fetchBlob(path) {
  const r = await fetch(fileUrl(path), { headers: isLocal() ? {} : ghHeaders(true) });
  if (!r.ok) throw new Error(await errMsg(r));
  return r.blob();
}
async function ghApi(apiPath, { method = 'GET', body, repo } = {}) {
  if (isLocal()) throw new Error('هذه العملية تحتاج وضع GitHub (الإعدادات)');
  if (!settings.token) throw new Error('أضف توكن GitHub في الإعدادات أولًا');
  const r = await fetch(`https://api.github.com/repos/${repo || settings.repo}/${apiPath}`, {
    method, headers: { ...ghHeaders(false), ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error(await errMsg(r));
  if (r.status === 204) return null;
  return r.json();
}
function b64utf8(str) { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin); }
async function putFile(path, text, message) {
  let sha;
  try { const meta = await ghApi(`contents/${encPath(path)}?ref=${encodeURIComponent(settings.branch)}`); sha = meta?.sha; } catch {}
  return ghApi(`contents/${encPath(path)}`, { method: 'PUT', body: { message, content: b64utf8(text), branch: settings.branch, ...(sha ? { sha } : {}) } });
}
const codeRepo = () => settings.codeRepo || DEFAULTS.codeRepo || settings.repo;
// الأمر يُكتب في مستودع البيانات الخاص ثم يُطلب تشغيل التنفيذ في مستودع الكود،
// حتى لا يظهر محتوى الأمر (مثل نص الرد) في سجلات مستودع الكود العام.
async function dispatchAction(payload) {
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');
  const name = `${stamp}-${Math.random().toString(36).slice(2, 8)}.json`;
  await putFile(dataPath(`actions/queue/${name}`), JSON.stringify(payload, null, 2), `أمر جديد: ${payload.action}`);
  await ghApi('dispatches', { method: 'POST', repo: codeRepo(), body: { event_type: 'mail-action' } });
}
async function runWorkflow(file, inputs = {}) {
  await ghApi(`actions/workflows/${file}/dispatches`, { method: 'POST', repo: codeRepo(), body: { ref: settings.branch, inputs } });
}
function configured() { return isLocal() || (settings.repo && settings.token); }

/* ========= تحميل البيانات ========= */
async function loadAccounts(force = false) {
  if (mem.accounts && !force) return mem.accounts;
  const data = await fetchJSON(dataPath('accounts.json'));
  mem.accounts = data || { updated: null, accounts: [], totals: {} };
  return mem.accounts;
}
function accById(id) { return (mem.accounts?.accounts || []).find(a => a.id === id); }
async function loadIndex(accId, month, force = false) {
  const key = `${accId}/${month}`;
  if (mem.index.has(key) && !force) return mem.index.get(key);
  const items = (await fetchJSON(dataPath(`index/${accId}/${month}.json`))) || [];
  items.forEach(e => { e.account = accId; });
  mem.index.set(key, items);
  return items;
}
async function pool(tasks, n = 6) {
  const out = []; let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, async () => { while (i < tasks.length) { const k = i++; out[k] = await tasks[k](); } }));
  return out;
}

function navHtml(active, cls) {
  return NAV.map(([r, ic, l]) => `<a href="#/${r}" class="${active === r ? 'active' : ''}"><span class="ic">${ic}</span><span>${l}</span></a>`).join('');
}
function setNav(active) { $('#sideNav').innerHTML = navHtml(active); $('#bottomNav').innerHTML = navHtml(active); }
function render(html) { $('#view').innerHTML = html; window.scrollTo({ top: 0 }); }
function loadingHtml(t = 'جارٍ التحميل…') { return `<div class="loading"><span class="spinner"></span> ${t}</div>`; }
function errorHtml(e) { return `<div class="notice err">⚠️ ${esc(e.message || e)}</div>`; }
async function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [name, ...rest] = h.split('/');
  const base = (name || '').split('?')[0];
  setNav(['msg'].includes(base) ? 'mail' : (base === 'account' ? 'accounts' : base));
  if (!configured() && base !== 'settings') { location.hash = '#/settings'; return; }
  try {
    switch (base) {
      case '': return await viewHome();
      case 'mail': return await viewMail();
      case 'msg': return await viewMessage(rest[0], rest[1]);
      case 'accounts': return await viewAccounts();
      case 'account': return await viewAccountEdit(rest[0] === 'new' ? null : decodeURIComponent(rest[0] || ''));
      case 'compose': return await viewCompose(rest[0]);
      case 'log': return await viewLog();
      case 'settings': return viewSettings();
      default: location.hash = '#/';
    }
  } catch (e) { console.error(e); render(errorHtml(e)); }
}

  async function refreshList() {
    $('#mailList').innerHTML = loadingHtml();
    const chosen = mailState.acc === 'all' ? accs : accs.filter(a => a.id === mailState.acc);

function attIcon(ct = '') { if (ct.startsWith('image/')) return '🖼'; if (ct.includes('pdf')) return '📕'; if (ct.includes('zip') || ct.includes('compressed')) return '🗜'; if (ct.includes('sheet') || ct.includes('excel') || ct.includes('csv')) return '📊'; if (ct.includes('word') || ct.includes('document')) return '📝'; return '📎'; }

async function download(path, name) {
  try {
    toast('جارٍ التنزيل…');
    const blob = await fetchBlob(path);
    const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name || 'file'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 10000);
  } catch (e) { toast(e.message, true); }
}

const CONFIG_PATHS = () => [dataPath('config/accounts.yaml'), 'config/accounts.yaml', dataPath('config/accounts.json'), 'config/accounts.json'];
async function loadConfig(force = false) {
  if (mem.config && !force) return mem.config;
  for (const p of CONFIG_PATHS()) {
    const t = await fetchText(p);
    if (t != null) { mem.config = { path: p, doc: p.endsWith('.json') ? JSON.parse(t) : (jsyaml.load(t) || {}) }; return mem.config; }
  }
  mem.config = { path: isLocal() ? 'config/accounts.yaml' : 'config/accounts.yaml', doc: { defaults: { folders: ['INBOX'], archive: 'all', notify: 'matched' }, accounts: [] }, isNew: true };
  return mem.config;
}
async function saveConfig(cfg, message) {
  const text = cfg.path.endsWith('.json') ? JSON.stringify(cfg.doc, null, 2) : jsyaml.dump(cfg.doc, { lineWidth: -1, noRefs: true, quotingType: '"' });
  await putFile(cfg.path, text, message);
  cache.clear(); mem.config = null;
}

  function sync() { const gh = $('#sMode').value === 'github'; $$('.gh').forEach(e => e.classList.toggle('hidden', !gh)); $$('.lc').forEach(e => e.classList.toggle('hidden', gh)); }
  $('#sMode').onchange = sync; sync();
  const read = () => { settings = { ...settings, mode: $('#sMode').value, theme: $('#sTheme').value, repo: $('#sRepo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, ''), codeRepo: $('#sCode').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\/$/, ''), branch: $('#sBranch').value.trim() || 'main', prefix: $('#sPrefix').value.trim().replace(/^\/+|\/+$/g, ''), token: $('#sToken').value.trim(), localBase: $('#sLocal').value.trim() || '..' }; };
  $('#sSave').onclick = () => { read(); saveSettings(); applyTheme(); cache.clear(); mem.accounts = null; mem.index.clear(); mem.config = null; toast('تم الحفظ'); if (configured()) location.hash = '#/'; };
  $('#sTest').onclick = async () => {
    read(); applyTheme(); const out = $('#sResult'); out.textContent = 'جارٍ الاختبار…';
    try {
      if (isLocal()) { const d = await fetchJSON(dataPath('accounts.json')); out.textContent = d ? `✅ تم العثور على ${d.accounts?.length ?? 0} حساب` : '⚠️ لم يُعثر على accounts.json'; return; }
      const r = await ghApi('');
      const d = await fetchJSON(dataPath('accounts.json'));
      out.textContent = `✅ ${r.full_name} (${r.private ? 'خاص' : 'عام'}) — ${d ? `${d.accounts?.length ?? 0} حساب، آخر فحص ${ago(d.updated)}` : 'لا يوجد accounts.json بعد'}`;
    } catch (e) { out.textContent = '❌ ' + e.message; }
  };
}

/* ========= تشغيل ========= */
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
$('#btnTheme').onclick = () => { const cur = document.documentElement.getAttribute('data-theme'); settings.theme = cur === 'dark' ? 'light' : 'dark'; saveSettings(); applyTheme(); };
$('#btnRefresh').onclick = () => { cache.clear(); mem.accounts = null; mem.index.clear(); mem.config = null; route(); toast('تم التحديث'); };
addEventListener('hashchange', route);
route();
</script>
